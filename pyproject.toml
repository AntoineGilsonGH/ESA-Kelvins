[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kelvins"
version = "0.1.0"
description = "ESA Kelvins Spacecraft Collision Avoidance Challenge: data pipeline, metric, baselines"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "lightgbm>=4.0", "matplotlib>=3.7", "pyarrow>=14"]

[project.optional-dependencies]
dev = ["pytest>=7", "nbformat", "nbclient", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
